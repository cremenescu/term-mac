name: term-mac
options:
  bundleIdPrefix: ro.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"

targets:
  term-mac:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleName: term-mac
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright (c) 2026 Razvan Cremenescu. GPL-2.0-or-later."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.local.term-mac
        PRODUCT_NAME: term-mac
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.9"
